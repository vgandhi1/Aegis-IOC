services:
  backend:
    build: ./backend
    environment:
      # LOCAL DEMO ONLY — wire a real IdP before any real deploy.
      # No secret is shipped. Left empty, the backend generates a random signing
      # key per process (tokens drop on restart). Any non-local AEGIS_ENVIRONMENT
      # refuses to start without an explicit key.
      AEGIS_SECRET_KEY: "${AEGIS_SECRET_KEY:-}"
      AEGIS_ENVIRONMENT: "local"
      AEGIS_CORS_ORIGINS: '["http://localhost:8080"]'
      AEGIS_ENABLE_SIMULATORS: "true"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
